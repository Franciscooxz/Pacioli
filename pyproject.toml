[project]
name = "contaflow"
version = "0.1.0"
description = "Capa de automatizacion contable sobre Odoo para firmas contables colombianas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "minio>=7.2",
    "lxml>=5.3",
    "httpx>=0.28",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "sentry-sdk>=2.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "anthropic>=0.49",
    "signxml>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contaflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Las migraciones autogeneradas de Alembic tienen DDL largo; no las peleamos con lint.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "S"]
ignore = ["S101"]  # assert permitido en tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.ruff.lint.flake8-bugbear]
# Idioma de FastAPI: llamar Depends/Query/etc. en los defaults es correcto.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["contaflow"]

[[tool.mypy.overrides]]
module = [
    "minio.*",
    "testcontainers.*",
    "celery.*",
    "lxml.*",
    "argon2.*",
    "prometheus_fastapi_instrumentator.*",
    "anthropic.*",
    "signxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
